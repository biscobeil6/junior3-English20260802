<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#33445f"><title>中3英語アプリ v4.0</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#20242b;background:#f3f5f7}*{box-sizing:border-box}html,body,#app{min-height:100%;overscroll-behavior:none}body{margin:0;min-width:320px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}main{max-width:960px;margin:auto;padding:8px 18px calc(105px + env(safe-area-inset-bottom))}.card{background:#fff;border-radius:22px;padding:20px;margin:8px 0 12px;box-shadow:0 8px 28px #17203314}h1{text-align:center;margin:18px 0 8px}.subtitle{text-align:center;color:#667085;margin:0 0 18px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:42px}.counter{color:#667085;font-weight:700}.menuGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:800px;margin:22px auto}.menuButton{text-align:left;min-height:112px;padding:18px}.menuButton strong{display:block;font-size:1.22rem;margin-bottom:7px}.menuButton span{display:block;color:#667085;font-size:.91rem}.menuButton.primary span{color:#e8edf5}.stack{display:grid;gap:12px;max-width:560px;margin:20px auto}button{font:inherit;min-height:50px;padding:12px 16px;border:1px solid #c9d0da;border-radius:14px;background:#fff;cursor:pointer}.primary{background:#33445f;color:#fff;border:none;font-weight:700}.danger{color:#9d2626;border-color:#e4b8b8}.kind{color:#667085;font-weight:700;margin:0 0 12px}.promptBox{text-align:center;padding:4px 2px 10px}.english{font-family:"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;font-size:clamp(1.45rem,3.4vw,2.15rem);line-height:1.55;font-weight:650;overflow-wrap:anywhere}.japanese{font-size:clamp(1rem,2.3vw,1.25rem);line-height:1.65;margin:12px 0 0}.blank{display:inline-block;white-space:nowrap;margin:0 .10em;color:#596579;font-weight:650;letter-spacing:.04em}.blank.short{min-width:auto}.wordBank{margin:14px auto 2px;padding:12px 14px;max-width:760px;background:#f2f4f7;border-radius:14px;font-family:"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;font-size:clamp(1.05rem,2.4vw,1.35rem);line-height:1.75;font-weight:650;overflow-wrap:anywhere}.wordBankLabel{display:block;color:#667085;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:.78rem;font-weight:700;margin-bottom:2px}.correct{color:#d12626;font-weight:800}.conjugation{display:grid;gap:10px;max-width:560px;margin:4px auto 0;text-align:left}.conjugationInline{display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.3vw,24px);margin:4px auto 0;white-space:nowrap;overflow-x:auto;padding:4px 2px 8px;font-size:clamp(1rem,2.35vw,1.5rem)}.conjugationInline .item{display:inline-flex;align-items:center;gap:.38em}.conjugationInline .slot{display:inline-block;min-width:4.7em;border-bottom:3px solid #748094;text-align:center;line-height:1.4}.conjugationInline .baseValue{font-family:"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;font-weight:700}.conjugation .row{display:grid;grid-template-columns:7.5em 1fr;align-items:center;gap:10px;font-size:clamp(1.2rem,3vw,1.7rem)}.conjugation .line{border-bottom:3px solid #748094;min-height:1.45em}.learningPoint{font-size:.9rem;line-height:1.5;color:#4f5968;background:#f3f5f8;border:1px solid #dde2e9;padding:8px 11px;border-radius:10px;margin:6px 0 8px;text-align:left}.learningPointLabel{display:block;font-size:.76rem;font-weight:800;color:#667085;margin-bottom:3px}.answerNote{font-size:.9rem;line-height:1.55;color:#5f6672;background:#fff7d7;padding:10px 12px;border-radius:12px;margin:12px 0 0}.irregularExampleNote{margin:6px 0 4px;padding:8px 11px;line-height:1.45}.canvasLabel{display:none}.canvasBox{position:relative;margin:0 0 8px}.canvas{width:100%;height:clamp(205px,31vh,270px);display:block;background:#fff;border:2px solid #8993a3;border-radius:14px;touch-action:none;-webkit-user-select:none;user-select:none}.canvasHint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#b4bac4;font-size:1.05rem}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.actionGroup{display:flex;gap:10px;flex-wrap:wrap}.exitButton{margin-left:auto;color:#8f2525;border-color:#dfb4b4;background:#fff8f8}.answerButton,.nextButton{width:100%;margin-top:12px}.ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 10px}.ratings button{font-size:1.65rem;font-weight:700}.ratings button.selected{outline:3px solid #33445f;background:#edf1f7}.ratings small{display:block;font-size:.76rem;font-weight:400}.muted{color:#667085}.big{font-size:2.2rem;font-weight:750}.statline{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eceff3;padding:10px 0}.statline:last-child{border:0}.notice{background:#fff7d7;padding:11px 13px;border-radius:12px;line-height:1.55}.redAnswer{color:#d12626;font-family:"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;font-size:clamp(1.22rem,2.7vw,1.8rem);font-weight:800;line-height:1.4;text-align:center;padding:3px 6px 0;overflow-wrap:anywhere}.studyMain{padding-top:4px}.studyCard{padding-top:12px;padding-bottom:12px}.studyCard .kind{margin-bottom:4px}.studyCard .promptBox{padding-bottom:4px}.studyCard .canvasBox{margin-top:4px}.studyCard .actions{margin-top:6px}.studyCard .ratings{margin:8px 0 6px}.studyCard .ratings button{min-height:58px;padding:6px 8px}.studyCard .nextButton{margin-top:6px;min-height:46px}.studyCard .answerButton{margin-top:8px}@media(max-width:620px){main{padding:4px 12px calc(118px + env(safe-area-inset-bottom))}.menuGrid{grid-template-columns:1fr}.menuButton{min-height:88px}.card{padding:17px 15px}.canvas{height:clamp(205px,35vh,255px);min-height:205px}.ratings button{padding:8px 5px}.conjugation .row{grid-template-columns:6.7em 1fr}.canvasLabel{display:none}.english{line-height:1.48}.blank{min-width:2.8em}}
</style></head><body><div id="app"></div><script>const APP_KEY='juniorEnglishPrototype.v0.3';
const INTERVALS={1:1,2:3,3:7,4:14,5:30,6:60,7:90};
let allQuestions=[],groups={};
let state=loadState();
let screen='home',activeCategory='',activeLabel='',mode='round',queue=[],index=0,answerShown=false,pendingRating=null,sessionScores={circle:0,triangle:0,cross:0};
function defaultState(){return{progress:{},sessions:[],rounds:{}}}
function loadState(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(APP_KEY)||'{}'))}catch{return defaultState()}}
function save(){localStorage.setItem(APP_KEY,JSON.stringify(state))}
function todayPlus(days){const d=new Date();d.setDate(d.getDate()+days);return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(d)}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function currentQuestions(){return groups[activeCategory]||[]}
function ensureRound(){const list=currentQuestions();state.rounds[activeCategory] ||= {number:1,seen:[]};const r=state.rounds[activeCategory];const valid=new Set(list.map(q=>q.id));r.seen=[...new Set((r.seen||[]).filter(id=>valid.has(id)))];if(list.length&&r.seen.length>=list.length){r.number++;r.seen=[];save()}return r}
function roundRemaining(){const r=ensureRound(),seen=new Set(r.seen);return shuffle(currentQuestions().filter(q=>!seen.has(q.id)))}
function weakQuestions(){return allQuestions.filter(q=>['triangle','cross'].includes(state.progress[q.id]?.lastRating))}
function weakByCategory(){return activeCategory==='weak'?weakQuestions():[]}
function applyRating(q,r){const p=state.progress[q.id]||{currentStage:0,circleCount:0,triangleCount:0,crossCount:0,history:[]};let stage=p.currentStage||1;if(!p.currentStage)stage=r==='circle'?2:1;else if(r==='circle')stage=Math.min(7,stage+1);else if(r==='triangle')stage=Math.max(1,stage-1);else stage=1;Object.assign(p,{currentStage:stage,nextReviewDate:todayPlus(INTERVALS[stage]),lastRating:r,lastStudiedAt:new Date().toISOString(),isWeak:r!=='circle'});p[r+'Count']=(p[r+'Count']||0)+1;p.history=[...(p.history||[]),r].slice(-20);state.progress[q.id]=p;if(mode==='round'){const rr=ensureRound();if(!rr.seen.includes(q.id))rr.seen.push(q.id);if(currentQuestions().length&&rr.seen.length>=currentQuestions().length){rr.number++;rr.seen=[]}}save()}
function el(html){document.getElementById('app').innerHTML=html}
function home(){screen='home';render()}
function openCategory(key,label){activeCategory=key;activeLabel=label;screen='category';render()}
function openIrregular(){screen='irregularMenu';render()}
function startCount(m){mode=m;screen='count';render()}
function available(){if(mode==='weak')return shuffle(weakByCategory());if(mode==='round')return roundRemaining();return shuffle(currentQuestions())}
function startStudy(count){queue=available().slice(0,count);if(!queue.length){alert('出題できる問題がありません。');return}index=0;answerShown=false;pendingRating=null;sessionScores={circle:0,triangle:0,cross:0};strokes=[];screen='study';render()}
function selectRating(r){pendingRating=r;render()}
function nextQuestion(){if(!pendingRating)return;const q=queue[index];applyRating(q,pendingRating);sessionScores[pendingRating]++;if(index+1>=queue.length){state.sessions.push({category:activeCategory,label:activeLabel,mode,count:queue.length,scores:{...sessionScores},at:new Date().toISOString()});state.sessions=state.sessions.slice(-300);save();screen='result'}else{index++;answerShown=false;pendingRating=null;strokes=[];screen='study'}render()}
function render(){({home:renderHome,irregularMenu:renderIrregularMenu,category:renderCategory,count:renderCount,study:renderStudy,result:renderResult,stats:renderStats,settings:renderSettings,weakMenu:renderWeakMenu}[screen]||renderHome)()}
function renderHome(){const weak=weakQuestions().length;el(`<main><h1>中3英語アプリ <small style="font-size:.45em;color:#667085">v4.0</small></h1><p class="subtitle">問題形式と手書き操作の確認用・全${allQuestions.length}問</p><div class="menuGrid"><button class="menuButton primary" onclick="openCategory('word','英単語')"><strong>英単語</strong><span>例文穴埋め・書き取り（${groups.word.length}問）</span></button><button class="menuButton" onclick="openIrregular()"><strong>不規則動詞</strong><span>活用練習・例文穴埋め（${groups['irregular-conjugation'].length+groups['irregular-example'].length}問）</span></button><button class="menuButton" onclick="openCategory('phrase','熟語・連語')"><strong>熟語・連語</strong><span>英文中の熟語を書き取り（${groups.phrase.length}問）</span></button><button class="menuButton" onclick="openCategory('sentence','重要英文・定型表現')"><strong>重要英文・定型表現</strong><span>日本語から英文全文（${groups.sentence.length}問）</span></button><button class="menuButton" onclick="renderWeakMenu()"><strong>苦手復習</strong><span>△・×の問題（${weak}問）</span></button><button class="menuButton" onclick="screen='stats';render()"><strong>成績</strong><span>学習数と自己採点履歴</span></button></div><div class="stack"><button onclick="screen='settings';render()">設定・成績リセット</button></div></main>`)}
function renderIrregularMenu(){el(`<main><button onclick="home()">← ホーム</button><h1>不規則動詞</h1><p class="subtitle">活用練習と例文穴埋めを選べます</p><div class="stack"><button class="menuButton primary" onclick="openCategory('irregular-conjugation','不規則動詞・活用練習')"><strong>活用練習</strong><span>過去形と過去分詞を続けて書く（${groups['irregular-conjugation'].length}問）</span></button><button class="menuButton" onclick="openCategory('irregular-example','不規則動詞・例文穴埋め')"><strong>例文穴埋め</strong><span>文脈に合う活用形を書く（${groups['irregular-example'].length}問）</span></button></div></main>`)}
function renderCategory(){const list=currentQuestions(),r=ensureRound();el(`<main><button onclick="${activeCategory.startsWith('irregular-')?"openIrregular()":"home()"}">← 戻る</button><h1>${esc(activeLabel)}</h1><section class="card"><h2>周回モード</h2><p class="big">${r.number}周目</p><p>${r.seen.length} / ${list.length}問</p><button class="primary" onclick="startCount('round')">周回出題を始める</button></section><div class="stack"><button onclick="startCount('random')">ランダム出題</button></div></main>`)}
function renderCount(){const n=available().length;el(`<main><button onclick="screen='category';render()">← 戻る</button><h1>何問取り組みますか？</h1><p class="subtitle">${esc(activeLabel)}・出題可能 ${n}問</p><div class="stack">${[5,10,20].filter((v,i,a)=>Math.min(v,n)>0&&a.findIndex(x=>Math.min(x,n)===Math.min(v,n))===i).map(v=>`<button onclick="startStudy(${Math.min(v,n)})">${Math.min(v,n)}問${n<v?'（全問）':''}</button>`).join('')}</div></main>`)}
function blankCount(text){return String(text||'').trim().split(/\s+/).filter(Boolean).length||1}function renderParts(q){return q.parts.map(p=>{if(typeof p==='string')return esc(p);const ans=q.answerParts[p.blank];if(answerShown)return `<span class="correct">${esc(ans)}</span>`;return Array.from({length:blankCount(ans)},()=>`<span class="blank">（　　　）</span>`).join('')}).join('')}
function problemHTML(q){if(q.kind==='conjugation')return `<div class="promptBox"><div class="japanese" style="margin:2px 0 6px"><strong>意味</strong>　${esc(q.meaning||'')}</div><div class="conjugationInline"><span class="item"><strong>原形</strong><span class="baseValue">${esc(q.base)}</span></span><span class="item"><strong>過去形</strong>${answerShown?`<span class="correct">${esc(q.past)}${q.pastAlternative?` / ${esc(q.pastAlternative)}`:''}</span>`:`<span class="slot">（　　　）</span>`}</span><span class="item"><strong>過去分詞</strong>${answerShown?`<span class="correct">${esc(q.pastParticiple)}${q.pastParticipleAlternative?` / ${esc(q.pastParticipleAlternative)}`:''}</span>`:`<span class="slot">（　　　）</span>`}</span></div>${answerShown&&q.note?`<div class="answerNote">${esc(q.note)}</div>`:''}</div>`;if(q.kind==='sentence')return `<div class="promptBox"><div class="japanese" style="font-size:clamp(1.15rem,2.8vw,1.5rem);margin-top:4px">${esc(q.japanese)}</div>${!answerShown?`<div class="wordBank"><span class="wordBankLabel">使う語句（並べ替えて英文を作ります）</span>${(q.wordBank||[]).map(esc).join(' / ')}</div>`:''}</div>`;return `<div class="promptBox"><div class="english">${renderParts(q)}</div><div class="japanese">${esc(q.japanese)}</div></div>`}
function answerDetailHTML(q){if(!answerShown)return '';if(q.kind==='sentence')return `<div class="redAnswer">${esc(q.answer)}</div><div class="learningPoint"><span class="learningPointLabel">学習ポイント</span>${esc(q.learningPoint||'')}</div>`;if(q.category==='word'){const lemma=`<div class="learningPoint"><span class="learningPointLabel">見出し語・意味</span>${esc(q.headword||'')}（${esc(q.partOfSpeech||'')}）　${esc(q.meaning||'')}</div>`;return lemma;}if(q.category==='irregular-example'){return q.note?`<div class="answerNote irregularExampleNote">${esc(q.note)}</div>`:'';}if(q.category==='phrase'){const summary=`<div class="learningPoint"><span class="learningPointLabel">熟語・意味</span>${esc(q.headword||'')}　${esc(q.meaning||'')}</div>`;const note=q.notes?`<div class="answerNote irregularExampleNote">${esc(q.notes)}</div>`:'';return summary+note;}return ''}function renderStudy(){const q=queue[index];el(`<main class="studyMain"><div class="topbar"><span class="counter">${index+1} / ${queue.length}</span></div><section class="card studyCard"><p class="kind">${esc(q.label)}</p>${problemHTML(q)}${answerDetailHTML(q)}<div class="canvasBox"><canvas id="canvas" class="canvas"></canvas>${strokes.length?'':'<div class="canvasHint">ここに手書きします</div>'}</div><div class="actions"><div class="actionGroup"><button onclick="undoStroke()">一つ戻す</button><button onclick="clearCanvas()">全消去</button></div><button class="exitButton" onclick="confirm('学習を終了しますか？')&&home()">終了</button></div>${answerShown?`<div class="ratings"><button class="${pendingRating==='circle'?'selected':''}" onclick="selectRating('circle')">○<small>できた</small></button><button class="${pendingRating==='triangle'?'selected':''}" onclick="selectRating('triangle')">△<small>迷った</small></button><button class="${pendingRating==='cross'?'selected':''}" onclick="selectRating('cross')">×<small>書けなかった</small></button></div><button class="primary nextButton" ${pendingRating?'':'disabled style="opacity:.45"'} onclick="nextQuestion()">${index+1===queue.length?'結果を見る':'次の問題へ'}</button>`:`<button class="primary answerButton" onclick="answerShown=true;pendingRating=null;render()">答えを確認</button>`}</section></main>`);setupCanvas()}
function renderResult(){el(`<main><h1>今回の学習結果</h1><section class="card"><p>${esc(activeLabel)}</p><div class="statline"><span>取り組んだ問題</span><strong>${queue.length}問</strong></div><div class="statline"><span>○</span><strong>${sessionScores.circle}</strong></div><div class="statline"><span>△</span><strong>${sessionScores.triangle}</strong></div><div class="statline"><span>×</span><strong>${sessionScores.cross}</strong></div></section><div class="stack"><button class="primary" onclick="home()">ホームへ戻る</button></div></main>`)}
function renderWeakMenu(){activeCategory='weak';activeLabel='苦手復習';groups.weak=weakQuestions();screen='weakMenu';const n=groups.weak.length;el(`<main><button onclick="home()">← ホーム</button><h1>苦手復習</h1><p class="subtitle">最後の自己採点が△または×の問題</p>${n?`<div class="stack"><button class="primary" onclick="mode='weak';screen='count';render()">${n}問から出題する</button></div>`:`<section class="card"><p class="muted" style="text-align:center">まだ△・×の問題はありません。</p></section>`}</main>`)}
function renderStats(){const total=state.sessions.reduce((a,s)=>a+(s.count||0),0),ps=Object.values(state.progress);el(`<main><button onclick="home()">← ホーム</button><h1>成績</h1><section class="card"><div class="statline"><span>これまでの学習</span><strong>${total}問</strong></div><div class="statline"><span>学習済み問題</span><strong>${ps.length}問</strong></div><div class="statline"><span>苦手問題</span><strong>${weakQuestions().length}問</strong></div><div class="statline"><span>○</span><strong>${ps.reduce((a,p)=>a+(p.circleCount||0),0)}</strong></div><div class="statline"><span>△</span><strong>${ps.reduce((a,p)=>a+(p.triangleCount||0),0)}</strong></div><div class="statline"><span>×</span><strong>${ps.reduce((a,p)=>a+(p.crossCount||0),0)}</strong></div></section></main>`)}
function renderSettings(){el(`<main><button onclick="home()">← ホーム</button><h1>設定</h1><section class="card"><div class="notice">この試作版の成績は、この英語アプリ専用の保存領域に記録されます。漢字アプリの成績には影響しません。</div></section><div class="stack"><button class="danger" onclick="resetData()">成績をリセット</button></div></main>`)}
function resetData(){if(prompt('「リセット」と入力してください')==='リセット'){state=defaultState();save();alert('成績をリセットしました。');home()}}
let strokes=[],current=null,ctx,canvas,activePointerId=null,lastPoint=null;
function setupCanvas(){canvas=document.getElementById('canvas');const rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));ctx=canvas.getContext('2d',{alpha:true,desynchronized:true});ctx.setTransform(dpr,0,0,dpr,0,0);drawAll();let activeSource=null,touchId=null,lastStart={time:-Infinity,x:0,y:0,source:null};const pos=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}},near=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)<12,eventPoint=e=>({x:e.clientX,y:e.clientY});function conf(){ctx.strokeStyle='#1f2937';ctx.fillStyle='#1f2937';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round'}function seg(a,b){conf();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function dot(p){conf();ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill()}function batch(e){return typeof e.getCoalescedEvents==='function'&&(e.getCoalescedEvents()?.length)?e.getCoalescedEvents():[e]}function append(e){if(!current)return;for(const ev of batch(e)){const p=pos(ev);if(!lastPoint){current.push(p);lastPoint=p;dot(p);continue}if(Math.abs(p.x-lastPoint.x)<.05&&Math.abs(p.y-lastPoint.y)<.05)continue;current.push(p);seg(lastPoint,p);lastPoint=p}}function reset(){activePointerId=null;current=null;lastPoint=null}function begin(e){reset();activePointerId=e.pointerId;current=[];strokes.push(current);append(e);document.querySelector('.canvasHint')?.remove()}function finish(e){if(activePointerId===null||!current)return;if(e&&e.pointerId!==undefined&&e.pointerId!==activePointerId)return;if(e?.type==='pointerup')append(e);reset()}function duplicate(source,e){const now=performance.now(),p=eventPoint(e),dup=source!==lastStart.source&&now-lastStart.time<120&&near(p,lastStart);if(!dup)lastStart={time:now,x:p.x,y:p.y,source};return dup}canvas.oncontextmenu=e=>e.preventDefault();if('PointerEvent'in window){canvas.addEventListener('pointerdown',e=>{e.preven
